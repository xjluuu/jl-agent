name: Windows EXE Smoke Test

on:
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build EXE
        shell: cmd
        run: build_xjlagent_exe.bat --no-pause

      - name: Run EXE handoff checks
        shell: cmd
        run: |
          dist\xjlagent.exe --self-check
          dist\xjlagent.exe --permission-check
          dist\xjlagent.exe --exe-check
          dist\xjlagent.exe --onboarding

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: jl-agent-windows-exe
          path: dist/xjlagent.exe
