name: Paid setup request
description: Request commercial setup or deployment support for JL-Agent.
title: "[Setup]: "
labels: ["commercial-support"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for considering JL-Agent setup support.

        Do not paste API keys, internal documents, production data, customer data, passwords, private network details, or confidential company material into a public issue. Describe the deployment shape and constraints only.
  - type: dropdown
    id: package
    attributes:
      label: Setup package
      options:
        - Starter Setup - USD 99 fixed scope
        - Enterprise Pilot - USD 499+ deployment pilot
        - Custom Workflow - quote by scope
        - Not sure yet
    validations:
      required: true
  - type: dropdown
    id: payment_method
    attributes:
      label: Preferred payment method
      description: Payment is handled manually after scope confirmation. Do not paste payment QR codes or private account details in this public issue.
      options:
        - Alipay
        - WeChat Pay
        - PayPal / Wise / Stripe / other international method
        - Not sure yet
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Organization and use case
      description: What kind of team will use JL-Agent, and what workflow should it support?
      placeholder: |
        Example: restricted office PCs, non-Python users, internal model gateway, local document analysis, A-share research report reading, shared knowledge base.
    validations:
      required: true
  - type: dropdown
    id: target_runtime
    attributes:
      label: Target runtime
      options:
        - Windows EXE for users without Python
        - Python mode
        - Both Windows EXE and Python mode
        - Not sure yet
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment constraints
      description: Mention OS, network, storage, permissions, and model gateway constraints without exposing secrets.
      placeholder: |
        Example: Windows 10 now, Windows 11 later; restricted internet; shared drive path can be configured; only one admin has Python; model endpoint is internal.
    validations:
      required: true
  - type: checkboxes
    id: needs
    attributes:
      label: Capabilities needed
      options:
        - label: Windows EXE packaging and handover checklist
        - label: External config for API URL, key, model, personal path, and shared path
        - label: Role-based Admin / Maintainer / Viewer setup
        - label: Audit log and safe command configuration
        - label: Local knowledge-base ingestion workflow
        - label: A-share /stock daily report bridge
        - label: Parallel research or Risk Agent veto workflow
        - label: Offline dependency or restricted-network deployment notes
  - type: textarea
    id: contact
    attributes:
      label: Contact preference
      description: Share a safe contact method if you want to move payment and commercial details outside GitHub.
      placeholder: Email, GitHub profile, WeChat ID, or another safe contact method. Do not paste payment QR codes, secrets, or private company data.
  - type: textarea
    id: success
    attributes:
      label: What would count as success?
      description: Describe the concrete handover result you expect.
      placeholder: |
        Example: one admin can rebuild the EXE; three test users can run it without Python; config can be changed without rebuilding; /stock report can be viewed by Viewer users.
