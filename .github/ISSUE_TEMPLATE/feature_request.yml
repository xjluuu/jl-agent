name: Feature request
description: Suggest a new JL-Agent capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or pain point should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Target environment
      options:
        - Restricted enterprise environment
        - Windows EXE deployment
        - macOS/Linux Python mode
        - Personal machine
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
