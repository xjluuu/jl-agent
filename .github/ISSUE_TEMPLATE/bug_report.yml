name: Bug report
description: Report a reproducible JL-Agent bug.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the exact commands or actions.
      placeholder: |
        1. Run ...
        2. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste output with secrets removed.
      render: text
      placeholder: |
        python xjlagent.py --self-check
        python xjlagent.py --release-check
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11 x64 / Windows 10 / macOS / Linux
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: 3.11.9
